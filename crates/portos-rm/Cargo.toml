edition.workspace = true
description = "PortOS resource-management laws (可运行的法则表): F1 ledger · F2 teardown · F3 monitor · F4 verb table · F5 requires · F6 protocol/bestiary"

[features]
default = ["plan-shapes", "attach"]
# D31 隔离区：计划形状（Plan AST、demand_sum、admit_plan、check_plan…）仍在讨论中。
