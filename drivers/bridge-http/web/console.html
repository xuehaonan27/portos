<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PortOS console</title>
<!--
  One presenter for portos-bridge-http. Everything PortOS-specific it does is
  the two shapes the bridge exposes: subscribe to topics (EventSource) and
  invoke verbs (POST). The chat semantics — start a session, send a line, read
  `model::session::*` events — live here, not in the bridge, which is why a
  TUI or a native app can replace this file without touching the transport.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --dim: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --tool: #7c3aed;
    --bad: #dc2626;
    --panel: #f9fafb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --fg: #e6e6e6;
      --dim: #8b93a1;
      --line: #242833;
      --accent: #60a5fa;
      --tool: #a78bfa;
      --bad: #f87171;
      --panel: #161922;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  #status { color: var(--dim); font-size: 12px; margin-left: auto; }
  #tools { color: var(--dim); font-size: 12px; }
  main { overflow-y: auto; padding: 16px; }
  .turn { margin-bottom: 18px; }
  .who { font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .user .body {
    border-left: 2px solid var(--accent);
    padding-left: 10px;
  }
  .tool {
    color: var(--tool);
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    margin: 4px 0;
  }
  .tool.bad { color: var(--bad); }
  footer {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }
  textarea {
    flex: 1;
    resize: none;
    min-height: 44px;
    max-height: 180px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: inherit;
    font: inherit;
  }
  button {
    padding: 0 18px;
    border: 0;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    cursor: pointer;
  }
  button[disabled] { opacity: 0.5; cursor: default; }
  .err { color: var(--bad); font-size: 12px; }
</style>

<header>
  <h1>PortOS console</h1>
  <span id="tools"></span>
  <span id="status">connecting…</span>
</header>
<main id="log"></main>
<footer>
  <textarea id="input" placeholder="Message… (Enter to send, Shift+Enter for a newline)" disabled></textarea>
  <button id="send" disabled>Send</button>
</footer>

<script type="module">
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("send");
  const status = document.getElementById("status");
  const toolsEl = document.getElementById("tools");

  let session = null;
  let current = null; // the assistant turn being streamed

  /** The bridge's invoke path. A kernel denial comes back as {err}. */
  async function invoke(verb, args) {
    const res = await fetch("/invoke", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ verb, args }),
    });
    const body = await res.json();
    if (body.err) throw new Error(body.err);
    return body.ok;
  }

  function turn(who, cls) {
    const el = document.createElement("div");
    el.className = `turn ${cls}`;
    el.innerHTML = `<div class="who"></div><div class="body"></div>`;
    el.querySelector(".who").textContent = who;
    log.append(el);
    return el.querySelector(".body");
  }

  function scroll() {
    log.scrollTop = log.scrollHeight;
  }

  function note(text, bad = false) {
    const el = document.createElement("div");
    el.className = bad ? "tool bad" : "tool";
    el.textContent = text;
    log.append(el);
    scroll();
  }

  function onSessionEvent(data) {
    switch (data.kind) {
      case "delta":
        if (!current) current = turn("assistant", "assistant");
        current.textContent += data.text ?? "";
        scroll();
        break;
      case "tool_call":
        note(`⏺ ${data.verb}`);
        current = null;
        break;
      case "tool_result":
        note(`⏺ ${data.verb} ${data.ok ? "done" : "failed"}`, !data.ok);
        break;
      case "done":
        current = null;
        setBusy(false);
        break;
    }
  }

  function setBusy(busy) {
    input.disabled = busy || !session;
    sendBtn.disabled = busy || !session;
    status.textContent = !session ? "no session" : busy ? "working…" : `session ${session}`;
    if (!busy && session) input.focus();
  }

  async function send() {
    const text = input.value.trim();
    if (!text || !session) return;
    input.value = "";
    turn("you", "user").textContent = text;
    scroll();
    setBusy(true);
    try {
      await invoke("model::send", { session, text });
    } catch (e) {
      note(String(e.message ?? e), true);
      setBusy(false);
    }
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  // The event plane, filtered to this session's topic. Subscribing happened
  // bridge-side; this end only decides what to show.
  const events = new EventSource("/events");
  events.onmessage = (m) => {
    const { topic, data } = JSON.parse(m.data);
    if (session && topic === `model::session::${session}`) onSessionEvent(data);
  };
  events.onerror = () => {
    status.textContent = "disconnected — reconnecting…";
  };

  try {
    const grants = (await (await fetch("/grants")).json()).grants ?? [];
    toolsEl.textContent = grants.length
      ? `${grants.length} verb${grants.length > 1 ? "s" : ""} granted`
      : "no verbs granted";
    toolsEl.title = grants.map((g) => g.verb).join("\n");
    session = (await invoke("model::start", {})).session;
    setBusy(false);
  } catch (e) {
    status.textContent = "";
    const el = document.createElement("div");
    el.className = "err";
    el.textContent = `could not start a session: ${e.message ?? e}`;
    log.append(el);
  }
</script>
