[workspace]
resolver = "3"
members = ["abi", "kernel", "sdk/rust", "cli", "drivers/egress", "drivers/router", "drivers/model", "plugins/broker", "plugins/echo", "plugins/modeld", "plugins/fs", "plugins/shell", "plugins/remote", "plugins/model-echo"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
blake3 = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
nix = { version = "0.29", features = ["signal"] }
rand = "0.8"
regex = "1"
hex = "0.4"
tar = "0.4"
ureq = "2"
url = "2"
