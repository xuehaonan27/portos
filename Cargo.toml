[workspace]
resolver = "3"
members = ["crates/portos-cli", "crates/portos-compute", "crates/portos-echo", "crates/portos-kernel", "crates/portos-proto", "crates/portos-sdk"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
nix = { version = "0.29", features = ["socket", "uio", "fs"] }
rand = "0.8"
regex = "1"
hex = "0.4"
