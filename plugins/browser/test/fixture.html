<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Workshop Fixture — Login</title></head>
<body>
  <h1 id="h">Sign in</h1>
  <form id="f" onsubmit="event.preventDefault(); document.getElementById('h').textContent='Welcome, ' + document.getElementById('u').value;">
    <label>User <input id="u" name="username" placeholder="username" aria-label="username"></label>
    <label>Pass <input id="p" name="password" type="password" placeholder="password" aria-label="password"></label>
    <button id="go" type="submit">Sign in</button>
  </form>
  <a id="help" href="#help" role="link">Need help?</a>
</body>
</html>
